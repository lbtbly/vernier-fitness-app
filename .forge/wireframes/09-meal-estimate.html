<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<title>09 Meal estimate — Forge wireframe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;--s9:48px;
--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;--r-full:999px;--touch:44px;
--dur-fast:120ms;--dur:200ms;--dur-slow:900ms;--ease:cubic-bezier(.2,.6,.2,1)}
html[data-theme=dark]{color-scheme:dark;--bg:#0A0A0B;--surface:#141416;--surface-2:#1C1C1F;--surface-3:#232327;--line:#2A2A2E;--line-2:#3A3A40;--text:#F5F5F7;--text-2:#A1A1A8;--text-3:#7C7C85;--accent:#5AA9FF;--accent-ink:#08080A;--accent-soft:rgba(90,169,255,.14);--good:#4FD08A;--good-soft:rgba(79,208,138,.13);--warn:#E9B44C;--warn-soft:rgba(233,180,76,.13);--alert:#F07A6A;--alert-soft:rgba(240,122,106,.13);--chart-daily:#6E6E78;--chart-avg:#E8E8EC;--chart-goal:#7C8BA1;--chart-band:rgba(124,139,161,.10);--chart-grid:#232327;--focus:#8FC4FF;--page:#0E0E10;--page-ink:#8B8B93}
html[data-theme=light]{color-scheme:light;--bg:#F2F2F5;--surface:#FFFFFF;--surface-2:#EDEDF1;--surface-3:#E3E3E9;--line:#DCDCE2;--line-2:#C6C6CE;--text:#101013;--text-2:#4A4A52;--text-3:#6B6B73;--accent:#0A6CD0;--accent-ink:#FFFFFF;--accent-soft:rgba(10,108,208,.10);--good:#157F4E;--good-soft:rgba(21,127,78,.10);--warn:#8A5A00;--warn-soft:rgba(138,90,0,.10);--alert:#B3261E;--alert-soft:rgba(179,38,30,.10);--chart-daily:#9A9AA2;--chart-avg:#101013;--chart-goal:#5B6B80;--chart-band:rgba(91,107,128,.10);--chart-grid:#E3E3E9;--focus:#0A4C93;--page:#E7E7EC;--page-ink:#55555C}
body{font-family:var(--font);background:var(--page);color:var(--page-ink);padding:24px;-webkit-font-smoothing:antialiased}
.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;max-width:1720px;margin:0 auto 20px}
.bar h1{font-size:17px;color:var(--text);letter-spacing:-.01em}
.bar p{font-size:13px;margin-top:4px;max-width:70ch;line-height:1.5}
.themeswitch{min-height:34px;padding:0 14px;border-radius:var(--r-full);border:1px solid var(--line-2);background:transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer;flex:none}
.frames{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;max-width:1720px;margin:0 auto}
figure.frame{margin:0;width:393px}
figure.frame figcaption{font-size:12px;line-height:1.5;margin-bottom:8px;min-height:52px}
figure.frame figcaption b{color:var(--text);font-weight:600}
.phone{width:393px;height:852px;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);display:flex;flex-direction:column;border:1px solid var(--line-2);position:relative;font-size:15px;line-height:1.35}
.status{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.status svg{width:68px;height:14px;color:var(--text)}
.screen{flex:1;overflow-y:auto;padding:0 16px 20px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.card.flat{background:transparent}
.num{font-variant-numeric:tabular-nums}
.big{font-size:22px;font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--text-2);line-height:1.45}
.mut{color:var(--text-3)}
.good{color:var(--good)}.warn{color:var(--warn)}.alert{color:var(--alert)}
.row{display:flex;gap:12px;align-items:center;min-height:44px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:2px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--r-full);border:1px solid var(--line-2);font-size:12px;color:var(--text-2);white-space:nowrap}
.chip.g{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.src{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);font-size:11px;white-space:nowrap}
.src.est{border-style:dashed}
.src svg{width:12px;height:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.btn.icon{width:44px;height:44px;min-height:44px;padding:0;flex:none}
.photo{height:200px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-3);font-size:12px}
.photo .ph svg{width:34px;height:34px}
.photo .tagline{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#F5F5F7;border-radius:6px;padding:3px 7px;font-size:11px;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:var(--r-md);font-size:13px;line-height:1.45;margin-bottom:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text)}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--text-2)}
.rng{display:flex;align-items:center;gap:8px}
.rng .val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.stickybar{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 28px;background:var(--surface);border-top:1px solid var(--line)}
.macro{display:flex;gap:10px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.macro b{color:var(--text);font-weight:600}
.tabbar{height:83px;flex:none;padding:8px 6px 26px;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabbar a{flex:1;min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);text-decoration:none;font-size:10px}
.tabbar a[aria-current=page]{color:var(--accent)}
.tabbar svg{width:24px;height:24px}
.note{font-size:12px;color:var(--text-3);line-height:1.5}
.yes{color:var(--good)}
a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="ok" viewBox="0 0 20 20"><path d="M4 10.5 8 14.5 16 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="no" viewBox="0 0 20 20"><path d="M5.5 5.5 14.5 14.5M14.5 5.5 5.5 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="edit" viewBox="0 0 20 20"><path d="M4 16.5h3.2l8.6-8.6-3.2-3.2L4 13.3v3.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
<symbol id="chev" viewBox="0 0 20 20"><path d="M7.5 4.5 13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="minus" viewBox="0 0 20 20"><path d="M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="cam" viewBox="0 0 20 20"><rect x="2.4" y="5.4" width="15.2" height="11.2" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="11" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.2 5.4 8.4 3.4h3.2l1.2 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
<symbol id="spark" viewBox="0 0 20 20"><path d="M10 2.5 11.6 7 16 8.6 11.6 10.2 10 14.7 8.4 10.2 4 8.6 8.4 7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
<symbol id="shield" viewBox="0 0 20 20"><path d="M10 2.6 16.4 5v5.4c0 3.6-2.6 6-6.4 7-3.8-1-6.4-3.4-6.4-7V5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 10.2 9.2 12.4l4-4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="cal" viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="16" rx="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.4 9.6h17.2M8 3.2v3M16 3.2v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
<symbol id="wave" viewBox="0 0 24 24"><path d="M2.5 12.5h4l2-5.5 3.6 11 2.4-7 1.5 1.5h5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="dumb" viewBox="0 0 24 24"><path d="M4 9v6M7 7.2v9.6M17 7.2v9.6M20 9v6M7 12h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="fork" viewBox="0 0 24 24"><path d="M7 3v7M5 3v4.2a2 2 0 0 0 4 0V3M7 10v11M16.6 3c-1.8 2-1.8 6.4 0 8.4V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.6v3M12 18.4v3M21.4 12h-3M5.6 12h-3M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1M18.6 18.6l-2.1-2.1M7.5 7.5 5.4 5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
<symbol id="statr" viewBox="0 0 68 14"><path d="M1 10h2.4v3H1zM6 8h2.4v5H6zM11 5.6h2.4v7.4H11zM16 3.2h2.4v9.8H16z" fill="currentColor"/><path d="M27.4 5.4a8.6 8.6 0 0 1 10.4 0M29.8 8.2a5.2 5.2 0 0 1 5.6 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M32.6 10.9l1.6 1.7 1.6-1.7a2.4 2.4 0 0 0-3.2 0z" fill="currentColor"/><rect x="48" y="3.4" width="17" height="9" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/><rect x="49.6" y="5" width="11.4" height="5.8" rx="1.4" fill="currentColor"/><path d="M66.6 6.6v2.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".55"/></symbol>
</svg>

<div class="bar">
  <div>
    <h1>09 Meal estimate</h1>
    <p>Photograph the plate, read exactly what leaves the machine, then correct what the model got wrong. Portions are ranges because a photo cannot give grams. The estimate origin survives the save and every later edit.</p>
  </div>
  <button class="themeswitch" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';this.textContent=document.documentElement.dataset.theme==='dark'?'Light mode':'Dark mode'">Light mode</button>
</div>

<div class="frames">

<!-- FRAME 1 -->
<figure class="frame">
<figcaption><b>Consent, before the send.</b> Both lists, what goes and what stays. The photo is resized and stripped of EXIF on the phone, before the request exists.</figcaption>
<div class="phone">
  <div class="status"><span>13:12</span><svg><use href="#statr"/></svg></div>
  <div class="screen">
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0 12px">
      <button class="btn icon" aria-label="Cancel"><svg><use href="#no"/></svg></button>
      <div class="grow"><div style="font-size:20px;font-weight:700;letter-spacing:-.01em">Send this photo to Claude?</div><div class="note num">Lunch, Friday 21 August, 13:12</div></div>
    </div>

    <div class="photo" style="margin-bottom:12px">
      <div class="ph"><svg><use href="#cam"/></svg>Your photo</div>
      <div class="tagline">1092 x 819 &middot; 148 kB &middot; EXIF removed</div>
    </div>

    <div class="card">
      <div class="between" style="margin-bottom:10px"><span class="lbl">What leaves this machine</span><svg style="width:18px;height:18px;color:var(--good)"><use href="#shield"/></svg></div>
      <div class="row"><span class="grow">The photo above</span><span class="sub num">1092 px, no location</span></div>
      <div class="row"><span class="grow">Three words of context</span><span class="sub">lunch, weekday, at home</span></div>
      <div class="row"><span class="grow">The question</span><span class="sub">identify foods and portions</span></div>
    </div>

    <div class="card">
      <div class="lbl" style="margin-bottom:10px">What does not</div>
      <div class="row"><span class="grow mut">Your name, age, weight or waist</span><span class="sub">stays here</span></div>
      <div class="row"><span class="grow mut">Any lab result or health history</span><span class="sub">stays here</span></div>
      <div class="row"><span class="grow mut">Location, device, other photos</span><span class="sub">stays here</span></div>
      <div class="row"><span class="grow mut">Any credential</span><span class="sub">never sent, never rendered</span></div>
    </div>

    <div class="card">
      <div class="row"><span class="grow sub mut">Goes to</span><span class="num">Anthropic API, over TLS</span></div>
      <div class="row"><span class="grow sub mut">Sent from</span><span class="num">the Mac mini, not the phone</span></div>
      <div class="row"><span class="grow sub mut">This call costs about</span><span class="num">0.004 EUR</span></div>
      <div class="row"><span class="grow sub mut">This month</span><span class="num">4.18 of 15.00 EUR</span></div>
    </div>

    <button class="btn primary block" style="margin-bottom:10px">Send it</button>
    <button class="btn block" style="margin-bottom:12px">Type the meal instead</button>
    <div class="between card" style="padding:12px 16px">
      <div class="stack grow"><span>Ask every time</span><span class="note">Turn it off in Settings, not here.</span></div>
      <div style="width:52px;height:32px;border-radius:16px;background:var(--accent);position:relative;flex:none"><span style="position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:50%;background:var(--accent-ink)"></span></div>
    </div>
  </div>
</div>
</figure>

<!-- FRAME 2 -->
<figure class="frame">
<figcaption><b>The estimate, as ranges.</b> No false precision. Each line is editable, anything missed can be added, and the totals stay ranges until you pin a number.</figcaption>
<div class="phone">
  <div class="status"><span>13:14</span><svg><use href="#statr"/></svg></div>
  <div class="screen" style="padding-bottom:140px">
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0 12px">
      <button class="btn icon" aria-label="Back" style="transform:scaleX(-1)"><svg><use href="#chev"/></svg></button>
      <div class="grow"><div style="font-size:20px;font-weight:700;letter-spacing:-.01em">Check the estimate</div><div class="note num">Lunch, 21 August, 13:12</div></div>
      <span class="src est"><svg><use href="#spark"/></svg>Estimate</span>
    </div>

    <div class="photo" style="height:150px;margin-bottom:12px">
      <div class="ph"><svg><use href="#cam"/></svg>Your photo</div>
    </div>

    <div class="banner">
      <svg><use href="#spark"/></svg>
      <div>Claude saw a salmon fillet, roast potatoes and green beans, with visible oil. Portions come from plate size, so treat them as ranges.</div>
    </div>

    <div class="card">
      <div class="row">
        <div class="stack grow"><span style="font-weight:600">Grilled salmon fillet</span><span class="note num">140 to 180 g</span></div>
        <button class="btn icon" aria-label="Edit the salmon portion"><svg><use href="#edit"/></svg></button>
        <button class="btn icon" aria-label="Remove the salmon"><svg><use href="#no"/></svg></button>
      </div>
      <div class="row">
        <div class="stack grow"><span style="font-weight:600">Roast potatoes</span><span class="note num">180 to 220 g</span></div>
        <button class="btn icon" aria-label="Edit the potato portion"><svg><use href="#edit"/></svg></button>
        <button class="btn icon" aria-label="Remove the potatoes"><svg><use href="#no"/></svg></button>
      </div>
      <div class="row">
        <div class="stack grow"><span style="font-weight:600">Green beans</span><span class="note num">90 to 120 g</span></div>
        <button class="btn icon" aria-label="Edit the bean portion"><svg><use href="#edit"/></svg></button>
        <button class="btn icon" aria-label="Remove the beans"><svg><use href="#no"/></svg></button>
      </div>
      <div class="row">
        <div class="stack grow"><span style="font-weight:600">Olive oil</span><span class="note num">1 to 2 tablespoons</span></div>
        <button class="btn icon" aria-label="Edit the oil amount"><svg><use href="#edit"/></svg></button>
        <button class="btn icon" aria-label="Remove the oil"><svg><use href="#no"/></svg></button>
      </div>
      <button class="btn block" style="margin-top:12px"><svg><use href="#plus"/></svg>Add something it missed</button>
    </div>

    <div class="card">
      <div class="between"><span class="lbl">Totals</span><span class="src est"><svg><use href="#spark"/></svg>Estimate</span></div>
      <div class="big" style="margin:8px 0 6px">680 to 820 kcal</div>
      <div class="macro"><span>Protein <b>44 to 52 g</b></span><span>Carbs <b>48 to 58 g</b></span><span>Fat <b>30 to 40 g</b></span><span>Fibre <b>7 to 9 g</b></span></div>
      <div class="note" style="margin-top:10px">Saving keeps the middle of each range, 750 kcal, and keeps the range beside it. Set an exact weight on any line and that line stops being an estimate.</div>
    </div>

    <div class="card flat" style="border-style:dashed">
      <div class="lbl" style="margin-bottom:6px">This does not become a fact</div>
      <div class="sub">The entry stays badged as an estimate for as long as it exists, in the day view, in the week totals and in any export. Editing it does not scrub the origin.</div>
    </div>
  </div>
  <div class="stickybar">
    <button class="btn primary block" style="margin-bottom:8px">Save 750 kcal as lunch</button>
    <button class="btn block">Discard the estimate</button>
  </div>
</div>
</figure>

<!-- FRAME 3 -->
<figure class="frame">
<figcaption><b>Saved, still an estimate.</b> The day view shows the badge, the correction is recorded as yours, and two taps reach the photo that produced it.</figcaption>
<div class="phone">
  <div class="status"><span>13:16</span><svg><use href="#statr"/></svg></div>
  <div class="screen">
    <div style="padding:8px 0 12px"><div class="lbl">Friday 21 August</div><div style="font-size:30px;font-weight:700;letter-spacing:-.02em">Eat</div></div>

    <div class="card">
      <div class="between" style="margin-bottom:10px"><span class="lbl">Today</span><span class="num sub">1,168 of 2,150 kcal</span></div>
      <div class="row">
        <div class="stack grow"><span style="font-weight:600">Greek yoghurt, berries, walnuts</span><span class="note num">breakfast &middot; 07:20 &middot; 418 kcal</span></div>
        <span class="src">Planned</span>
      </div>
      <div class="row">
        <div class="stack grow"><span style="font-weight:600">Salmon, potatoes, green beans</span><span class="note num">lunch &middot; 13:12 &middot; 750 kcal, range 680 to 820</span></div>
        <span class="src est"><svg><use href="#spark"/></svg>Estimate</span>
      </div>
      <div class="row">
        <div class="stack grow mut"><span style="font-weight:600">Chicken tikka, basmati, spinach</span><span class="note num">dinner &middot; planned &middot; 690 kcal</span></div>
        <span class="chip">Not eaten</span>
      </div>
      <div class="between" style="border-top:1px solid var(--line);margin-top:6px;padding-top:12px">
        <span class="num" style="font-weight:600">1,168 kcal</span>
        <div class="macro"><span>P <b>96</b></span><span>C <b>88</b></span><span>F <b>48</b></span><span>Fibre <b>16</b></span></div>
      </div>
    </div>

    <div class="card">
      <div class="between" style="margin-bottom:10px"><span class="lbl">The lunch entry</span><span class="src est"><svg><use href="#spark"/></svg>Estimate</span></div>
      <div class="row"><span class="grow sub mut">Origin</span><span class="num">Photo, Claude vision</span></div>
      <div class="row"><span class="grow sub mut">Estimated</span><span class="num">21 Aug 2026, 13:14</span></div>
      <div class="row"><span class="grow sub mut">You corrected</span><span class="num">potatoes, 220 g exact</span></div>
      <div class="row"><span class="grow sub mut">Model</span><span class="num">claude-opus-5</span></div>
      <div class="row"><span class="grow sub mut">Photo</span><span class="num">kept on the Mac mini</span></div>
      <button class="btn block" style="margin-top:12px">Open the photo and the reply</button>
