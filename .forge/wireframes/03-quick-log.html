<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 Quick log — Forge wireframe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;--s9:48px;
--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;--r-full:999px;--touch:44px;
--dur-fast:120ms;--dur:200ms;--dur-slow:900ms;--ease:cubic-bezier(.2,.6,.2,1)}
html[data-theme=dark]{color-scheme:dark;--bg:#0A0A0B;--surface:#141416;--surface-2:#1C1C1F;--surface-3:#232327;--line:#2A2A2E;--line-2:#3A3A40;--text:#F5F5F7;--text-2:#A1A1A8;--text-3:#7C7C85;--accent:#5AA9FF;--accent-ink:#08080A;--accent-soft:rgba(90,169,255,.14);--good:#4FD08A;--good-soft:rgba(79,208,138,.13);--warn:#E9B44C;--warn-soft:rgba(233,180,76,.13);--alert:#F07A6A;--alert-soft:rgba(240,122,106,.13);--chart-daily:#6E6E78;--chart-avg:#E8E8EC;--chart-goal:#7C8BA1;--chart-band:rgba(124,139,161,.10);--chart-grid:#232327;--focus:#8FC4FF;--page:#0E0E10;--page-ink:#8B8B93}
html[data-theme=light]{color-scheme:light;--bg:#F2F2F5;--surface:#FFFFFF;--surface-2:#EDEDF1;--surface-3:#E3E3E9;--line:#DCDCE2;--line-2:#C6C6CE;--text:#101013;--text-2:#4A4A52;--text-3:#6B6B73;--accent:#0A6CD0;--accent-ink:#FFFFFF;--accent-soft:rgba(10,108,208,.10);--good:#157F4E;--good-soft:rgba(21,127,78,.10);--warn:#8A5A00;--warn-soft:rgba(138,90,0,.10);--alert:#B3261E;--alert-soft:rgba(179,38,30,.10);--chart-daily:#9A9AA2;--chart-avg:#101013;--chart-goal:#5B6B80;--chart-band:rgba(91,107,128,.10);--chart-grid:#E3E3E9;--focus:#0A4C93;--page:#E7E7EC;--page-ink:#55555C}
body{font-family:var(--font);background:var(--page);color:var(--page-ink);padding:24px;-webkit-font-smoothing:antialiased}
.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;max-width:1720px;margin:0 auto 20px}
.bar h1{font-size:17px;color:var(--text);letter-spacing:-.01em}
.bar p{font-size:13px;margin-top:4px;max-width:70ch;line-height:1.5}
.themeswitch{min-height:34px;padding:0 14px;border-radius:var(--r-full);border:1px solid var(--line-2);background:transparent;color:var(--text);font:inherit;font-size:13px;cursor:pointer;flex:none}
.frames{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;max-width:1720px;margin:0 auto}
figure.frame{margin:0;width:393px}
figure.frame figcaption{font-size:12px;line-height:1.5;margin-bottom:8px;min-height:52px}
figure.frame figcaption b{color:var(--text);font-weight:600}
.phone{width:393px;height:852px;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);display:flex;flex-direction:column;border:1px solid var(--line-2);position:relative;font-size:15px;line-height:1.35}
.status{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.status svg{width:68px;height:14px;color:var(--text)}
.screen{flex:1;overflow-y:auto;padding:0 16px 20px}
.title{padding:4px 0 12px}
.title h2{font-size:30px;letter-spacing:-.02em;font-weight:700;line-height:1.1}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.card.flat{background:transparent}
.metric{font-size:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.05}
.metric small{font-size:15px;color:var(--text-2);font-weight:400;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--text-2);line-height:1.45}
.mut{color:var(--text-3)}
.good{color:var(--good)}.warn{color:var(--warn)}.alert{color:var(--alert)}
.row{display:flex;gap:12px;align-items:center;min-height:44px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:2px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--r-full);border:1px solid var(--line-2);font-size:12px;color:var(--text-2);white-space:nowrap}
.chip.g{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.src{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);font-size:11px}
.src svg{width:12px;height:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);font:inherit;font-size:16px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.btn.icon{width:44px;height:44px;min-height:44px;padding:0;flex:none}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:var(--r-md);font-size:13px;line-height:1.45;margin-bottom:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text)}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--text-2)}
.tabbar{height:83px;flex:none;padding:8px 6px 26px;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabbar a{flex:1;min-width:44px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);text-decoration:none;font-size:10px}
.tabbar a[aria-current=page]{color:var(--accent)}
.tabbar svg{width:24px;height:24px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:8px 16px 0;display:flex;flex-direction:column;max-height:88%}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 12px;flex:none}
.sheetbody{overflow-y:auto;padding-bottom:12px}
.sheetfoot{flex:none;padding:12px 0 28px;border-top:1px solid var(--line);background:var(--surface)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:60px;height:60px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
.stepper button svg{width:24px;height:24px}
.scale5{display:flex;gap:8px}
.scale5 button{flex:1;height:52px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text-2);font:inherit;font-size:17px;font-variant-numeric:tabular-nums;cursor:pointer}
.scale5 button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.anchors{display:flex;justify-content:space-between;margin-top:6px}
.anchors span{font-size:11px;color:var(--text-3)}
.ta{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);font:inherit;font-size:15px;padding:12px 14px;resize:none}
.note{font-size:12px;color:var(--text-3);line-height:1.5}
.reach{position:absolute;left:-60px;bottom:-40px;width:520px;height:520px;border-radius:50%;border:1.5px dashed var(--accent);opacity:.5;pointer-events:none}
.reachlbl{position:absolute;left:20px;bottom:392px;font-size:11px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="ok" viewBox="0 0 20 20"><path d="M4 10.5 8 14.5 16 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="no" viewBox="0 0 20 20"><path d="M5.5 5.5 14.5 14.5M14.5 5.5 5.5 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="minus" viewBox="0 0 20 20"><path d="M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="cam" viewBox="0 0 20 20"><rect x="2.4" y="5.4" width="15.2" height="11.2" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="11" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.2 5.4 8.4 3.4h3.2l1.2 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
<symbol id="cloudoff" viewBox="0 0 20 20"><path d="M6.4 15.6h7.8a3.4 3.4 0 0 0 .6-6.7 5 5 0 0 0-7.4-3.4M4.6 8.4a3.6 3.6 0 0 0 .6 7.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2.6 2.6 17.4 17.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
<symbol id="undo" viewBox="0 0 20 20"><path d="M4 8.6h8.2a4.2 4.2 0 1 1 0 8.4H8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 5.6 4 8.6l3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="hand" viewBox="0 0 20 20"><path d="M6.5 10V4.6a1.5 1.5 0 0 1 3 0V9M9.5 9V3.6a1.5 1.5 0 0 1 3 0V9M12.5 9V5.6a1.5 1.5 0 0 1 3 0v6.6a5 5 0 0 1-5 5H9.4a4 4 0 0 1-3.1-1.5L3.6 11.8a1.5 1.5 0 0 1 2.3-1.9L6.5 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="cal" viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="16" rx="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.4 9.6h17.2M8 3.2v3M16 3.2v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
<symbol id="wave" viewBox="0 0 24 24"><path d="M2.5 12.5h4l2-5.5 3.6 11 2.4-7 1.5 1.5h5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="dumb" viewBox="0 0 24 24"><path d="M4 9v6M7 7.2v9.6M17 7.2v9.6M20 9v6M7 12h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="fork" viewBox="0 0 24 24"><path d="M7 3v7M5 3v4.2a2 2 0 0 0 4 0V3M7 10v11M16.6 3c-1.8 2-1.8 6.4 0 8.4V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.6v3M12 18.4v3M21.4 12h-3M5.6 12h-3M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1M18.6 18.6l-2.1-2.1M7.5 7.5 5.4 5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
<symbol id="statr" viewBox="0 0 68 14"><path d="M1 10h2.4v3H1zM6 8h2.4v5H6zM11 5.6h2.4v7.4H11zM16 3.2h2.4v9.8H16z" fill="currentColor"/><path d="M27.4 5.4a8.6 8.6 0 0 1 10.4 0M29.8 8.2a5.2 5.2 0 0 1 5.6 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M32.6 10.9l1.6 1.7 1.6-1.7a2.4 2.4 0 0 0-3.2 0z" fill="currentColor"/><rect x="48" y="3.4" width="17" height="9" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/><rect x="49.6" y="5" width="11.4" height="5.8" rx="1.4" fill="currentColor"/><path d="M66.6 6.6v2.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".55"/></symbol>
<symbol id="statr-off" viewBox="0 0 68 14"><path d="M1 10h2.4v3H1zM6 8h2.4v5H6z" fill="currentColor" opacity=".4"/><path d="M27 4.4 38.2 12M38.2 4.4 27 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".7"/><rect x="48" y="3.4" width="17" height="9" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/><rect x="49.6" y="5" width="11.4" height="5.8" rx="1.4" fill="currentColor"/></symbol>
</svg>

<div class="bar">
  <div>
    <h1>03 Quick log</h1>
    <p>The fast capture sheet, raised from Today, Health or a notification. One hand, one thumb, no keyboard unless you want the note. It writes to the phone first and syncs after, so a basement gym with a captive wifi portal changes nothing.</p>
  </div>
  <button class="themeswitch" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';this.textContent=document.documentElement.dataset.theme==='dark'?'Light mode':'Dark mode'">Light mode</button>
</div>

<div class="frames">

<!-- FRAME 1 -->
<figure class="frame">
<figcaption><b>The sheet, filled.</b> Waist prefilled from the last measurement so a confirm is one tap. The four feeling scales are 52 px targets across the full width. Save is the only accent.</figcaption>
<div class="phone">
  <div class="status"><span>18:32</span><svg><use href="#statr-off"/></svg></div>
  <div class="screen">
    <div class="title"><div class="lbl">Friday 21 August</div><h2>Today</h2></div>
    <div class="card"><div class="lbl">Your day</div><div class="sub" style="margin-top:8px">Home strength, 18:45</div></div>
  </div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="between" style="margin-bottom:14px">
      <div class="stack"><span style="font-size:20px;font-weight:700;letter-spacing:-.01em">Quick log</span><span class="note num">Friday 21 August, 18:32</span></div>
      <button class="btn icon" aria-label="Close"><svg><use href="#no"/></svg></button>
    </div>
    <div class="sheetbody">

      <div class="between" style="margin-bottom:10px"><span class="lbl">Waist</span><span class="note num">Last 98.5 cm, 18 Aug</span></div>
      <div class="stepper" style="margin-bottom:20px">
        <button aria-label="Down half a centimetre"><svg><use href="#minus"/></svg></button>
        <div class="grow" style="text-align:center"><div class="metric">98.0 <small>cm</small></div></div>
        <button aria-label="Up half a centimetre"><svg><use href="#plus"/></svg></button>
      </div>

      <div class="lbl" style="margin-bottom:8px">Energy</div>
      <div class="scale5">
        <button>1</button><button>2</button><button>3</button><button aria-pressed="true">4</button><button>5</button>
      </div>
      <div class="anchors" style="margin-bottom:18px"><span>Drained</span><span>Strong</span></div>

      <div class="lbl" style="margin-bottom:8px">Fatigue</div>
      <div class="scale5">
        <button>1</button><button aria-pressed="true">2</button><button>3</button><button>4</button><button>5</button>
      </div>
      <div class="anchors" style="margin-bottom:18px"><span>None</span><span>Wiped out</span></div>

      <div class="lbl" style="margin-bottom:8px">Hunger</div>
      <div class="scale5">
        <button>1</button><button>2</button><button aria-pressed="true">3</button><button>4</button><button>5</button>
      </div>
      <div class="anchors" style="margin-bottom:18px"><span>None</span><span>Ravenous</span></div>

      <div class="lbl" style="margin-bottom:8px">Satiety after eating</div>
      <div class="scale5">
        <button>1</button><button>2</button><button>3</button><button aria-pressed="true">4</button><button>5</button>
      </div>
      <div class="anchors" style="margin-bottom:18px"><span>Still empty</span><span>Too full</span></div>

      <div class="lbl" style="margin-bottom:8px">Note</div>
      <textarea class="ta" style="margin-bottom:14px">Slept badly. Left knee fine.</textarea>

      <div class="between" style="margin-bottom:14px">
        <span class="sub">Add a meal photo instead</span>
        <button class="btn icon" aria-label="Photograph a meal"><svg><use href="#cam"/></svg></button>
      </div>
    </div>
    <div class="sheetfoot">
      <button class="btn primary block">Save</button>
      <div class="note" style="text-align:center;margin-top:8px">Saves on this phone first. Nothing here needs a network.</div>
    </div>
  </div>
</div>
</figure>

<!-- FRAME 2 -->
<figure class="frame">
<figcaption><b>Saved offline.</b> Committed locally, stated plainly, undoable for as long as it sits in the queue. No spinner, no retry loop, no lost typing.</figcaption>
<div class="phone">
  <div class="status"><span>18:33</span><svg><use href="#statr-off"/></svg></div>
  <div class="screen">
    <div class="title"><div class="lbl">Friday 21 August</div><h2>Today</h2></div>
    <div class="banner" style="padding:9px 12px">
      <svg><use href="#cloudoff"/></svg>
      <div class="grow"><b>Offline.</b> 3 entries saved on this phone.</div>
    </div>
    <div class="card">
      <div class="lbl" style="margin-bottom:4px">Just logged</div>
      <div class="row">
        <div class="stack grow"><span style="font-weight:600">Waist 98.0 cm</span><span class="sub num">18:32, down 0.5 cm from 18 Aug</span></div>
        <span class="chip">Queued</span>
      </div>
      <div class="row">
        <div class="stack grow"><span style="font-weight:600">Energy 4, fatigue 2, hunger 3, satiety 4</span><span class="sub num">18:32</span></div>
        <span class="chip">Queued</span>
      </div>
      <div class="row">
        <div class="stack grow"><span style="font-weight:600">Note</span><span class="sub">Slept badly. Left knee fine.</span></div>
        <span class="chip">Queued</span>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn grow"><svg><use href="#undo"/></svg>Undo</button>
        <button class="btn grow">Edit</button>
      </div>
    </div>
    <div class="card flat" style="border-style:dashed">
      <div class="lbl" style="margin-bottom:6px">What happens next</div>
      <div class="sub">On the next connection the queue uploads in order and each entry keeps the time you typed it, not the time it arrived. If the Mac mini already holds a value for today, the app asks which one is right. It does not choose for you.</div>
    </div>
    <div class="card">
      <div class="between"><span class="lbl">Waist</span><span class="src"><svg><use href="#hand"/></svg>Manual</span></div>
      <div class="metric" style="margin:8px 0 2px">98.0 <small>cm</small></div>
      <div class="sub">-4.0 cm since 29 June. Next measurement due 25 August.</div>
    </div>
  </div>
  <nav class="tabbar">
    <a href="#" aria-current="page"><svg><use href="#cal"/></svg>Today</a>
    <a href="#"><svg><use href="#wave"/></svg>Health</a>
    <a href="#"><svg><use href="#dumb"/></svg>Train</a>
    <a href="#"><svg><use href="#fork"/></svg>Eat</a>
    <a href="#"><svg><use href="#gear"/></svg>Settings</a>
  </nav>
</div>
</figure>

<!-- FRAME 3 -->
<figure class="frame">
<figcaption><b>Reach and first use.</b> Annotation frame. Every control sits inside the right-thumb arc from a 393 px screen. Nothing that commits data lives above 420 px.</figcaption>
<div class="phone">
  <div class="status"><span>07:14</span><svg><use href="#statr"/></svg></div>
  <div class="screen">
    <div class="title"><div class="lbl">Friday 21 August</div><h2>Today</h2></div>
  </div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="between" style="margin-bottom:14px">
      <div class="stack"><span style="font-size:20px;font-weight:700;letter-spacing:-.01em">Quick log</span><span class="note num">First time</span></div>
      <button class="btn icon" aria-label="Close"><svg><use href="#no"/></svg></button>
    </div>
    <div class="sheetbody">
      <div class="card flat" style="border-style:dashed;margin-bottom:18px">
        <div style="font-size:17px;font-weight:600;margin-bottom:4px">No waist measurement yet</div>
        <div class="sub">Tape at the navel, standing, breathing out. Same spot each time matters more than the exact number.</div>
      </div>
      <div class="stepper" style="margin-bottom:20px">
        <button aria-label="Down half a centimetre"><svg><use href="#minus"/></svg></button>
        <div class="grow" style="text-align:center"><div class="metric mut">-- <small>cm</small></div></div>
        <button aria-label="Up half a centimetre"><svg><use href="#plus"/></svg></button>
      </div>
      <div class="lbl" style="margin-bottom:8px">Energy</div>
      <div class="scale5"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div>
