# Vernier on this Mac mini. Two services, two named volumes, one published port
# bound to loopback.
#
# Configuration is interpolated from the environment file Compose reads out of
# this directory on its own. There is no --env-file flag anywhere in the
# scripts, and no credential value is written here.

name: vernier

services:
  db:
    image: postgres:18-alpine
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
      # Deterministic initdb, so a restore never depends on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # No published port. Postgres is reachable on the compose network and
    # nowhere else, not even on loopback.
    volumes:
      # Postgres 18 images store data in a major-version subdirectory and
      # refuse to boot with the mount one level down. One mount at
      # /var/lib/postgresql, which is also what pg_upgrade --link needs.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vernier-app:local
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Identity and origin. The sign-in page renders these on every request.
      APP_URL: ${APP_URL}
      APP_NAME: ${APP_NAME:-Vernier}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME}
      TZ: ${TZ}
      # Demonstration mode. Off unless it is explicitly 1, and the seed refuses
      # to write anything at all when it is off. Every row it does write carries
      # source 'demo', so a demonstration reading is tellable from a real one by
      # reading the table.
      DEMO_MODE: ${DEMO_MODE:-0}
      # Withings. The mode decides which transport the adapter is built with:
      # demo answers from a generated dataset with no socket at all, live opens
      # one. Nothing here reached the container before slice 5, so the preflight
      # line that reads WITHINGS_CLIENT_SECRET inside it could not have passed.
      WITHINGS_MODE: ${WITHINGS_MODE:-demo}
      WITHINGS_CLIENT_ID: ${WITHINGS_CLIENT_ID:-}
      WITHINGS_CLIENT_SECRET: ${WITHINGS_CLIENT_SECRET:-}
      WITHINGS_REDIRECT_URI: ${WITHINGS_REDIRECT_URI:-}
      # Anthropic, the only metered cost in this build. The key reaches the
      # container from the environment file and nowhere else: the last line of
      # .forge/PREFLIGHT.md reads it back with printenv inside the container,
      # and it could not have passed before this block existed.
      #
      # With no key the app runs the whole photo flow against the demonstration
      # path. With no rate table a LIVE call is refused rather than made,
      # because a ceiling that cannot price a call is not a ceiling.
      ANTHROPIC_MODE: ${ANTHROPIC_MODE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_MONTHLY_CAP_USD: ${ANTHROPIC_MONTHLY_CAP_USD:-10}
      ANTHROPIC_INPUT_USD_PER_MTOK: ${ANTHROPIC_INPUT_USD_PER_MTOK:-}
      ANTHROPIC_OUTPUT_USD_PER_MTOK: ${ANTHROPIC_OUTPUT_USD_PER_MTOK:-}
      ANTHROPIC_MAX_OUTPUT_TOKENS: ${ANTHROPIC_MAX_OUTPUT_TOKENS:-1024}
      # Google Calendar, the same shape and for the same reason: demo answers
      # the picker, the busy periods, the calendar and every write from a
      # recorded Google with no socket at all, live opens one. Nothing here
      # reached the container before slice 11, so the preflight line that reads
      # GOOGLE_CLIENT_SECRET inside it could not have passed.
      GOOGLE_MODE: ${GOOGLE_MODE:-demo}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # A demonstration control and nothing else: none, outage or revoked. The
      # second makes the recorded Google unreachable, so the screen falls back to
      # stored availability and names the cause. The third makes it refuse the
      # grant, so the permanent-refusal path runs. Both prove a real code path
      # without a real Google account and without taking this machine's network
      # away.
      GOOGLE_DEMO_FAULT: ${GOOGLE_DEMO_FAULT:-none}
      # The connection string is assembled here so the app never needs to know
      # how the parts are stored.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MASTER_KEY: ${MASTER_KEY}
      # The nightly archive, slice 13.
      #
      # BACKUP_DIR is the path ON THIS MAC, and the app never writes to it
      # directly: it writes to BACKUP_MOUNT and NAMES this path, because an
      # alert reading "cannot write to /app/backups" tells the owner nothing he
      # can act on and F127 asks for the path and the cause. With it unset the
      # archive lands in the local fallback inside the storage volume and the
      # machine status screen says so.
      #
      # BACKUP_PASSPHRASE is optional and blank here on purpose. With no value
      # the archive key is derived from MASTER_KEY, which is already 32 random
      # bytes outside the repository, so the first archive can be written the
      # day this ships rather than after somebody generates a second secret.
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_MOUNT: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    ports:
      # 127.0.0.1 only. Tailscale Serve is the network barrier; the LAN address
      # must refuse the connection, which is F3.
      - "127.0.0.1:3000:3000"
    volumes:
      - storage:/app/storage
      # The archive destination, bind mounted from the host so an encrypted file
      # lands in iCloud Drive and is carried off this machine. Quoted, because an
      # iCloud Drive path has spaces in it and the short syntax splits on colons.
      #
      # With BACKUP_DIR unset this resolves to ./backups beside this file, which
      # is a real directory and a real place to write. The app still calls that a
      # fallback and still raises the alert, because what F127 is about is
      # whether the destination the owner CONFIGURED took the write.
      - "${BACKUP_DIR:-./backups}:/app/backups"
    healthcheck:
      # node:24-slim carries no curl. Node's own fetch is always there.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  # Named explicitly. Postgres data never lives in the image, and down.sh never
  # carries -v.
  pgdata:
    name: vernier_pgdata
  storage:
    name: vernier_storage
