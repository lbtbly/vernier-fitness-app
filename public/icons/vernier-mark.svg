<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vernier">
  <title>Vernier</title>
  <desc>Two rules offset by half a step. Three ticks above, two below, and one tick inked through where the two scales agree.</desc>
  <rect width="64" height="64" fill="#0A0A0B"/>
  <g stroke-linecap="butt" fill="none">
    <!-- light weight: the ticks that do not align -->
    <g stroke="#F5F5F7" stroke-width="3">
      <path d="M21 15.5V25"/>
      <path d="M33 15.5V25"/>
      <path d="M27 41v9.5"/>
    </g>
    <!-- heavy weight: the two rules and the tick inked through where they align -->
    <g stroke="#F5F5F7" stroke-width="4.5">
      <path d="M9 25h46"/>
      <path d="M9 41h46"/>
    </g>
    <path d="M45 13v40" stroke="#5AA9FF" stroke-width="4.5"/>
  </g>
</svg>
